name: repair field npm lockfile

on:
  push:
    branches:
      - field/fix-lockfile-swc-helper
    paths:
      - .github/workflows/repair-lockfile.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: field/fix-lockfile-swc-helper
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Add missing next-intl SWC helper lock entry
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("package-lock.json")
          text = path.read_text()
          key = '"node_modules/next-intl/node_modules/@swc/helpers"'
          if key in text:
              raise SystemExit(0)
          needle = '    "node_modules/next-themes": {'
          if needle not in text:
              raise SystemExit("safe insertion point not found")
          entry = '''    "node_modules/next-intl/node_modules/@swc/helpers": {
            "version": "0.5.23",
            "resolved": "https://registry.npmjs.org/@swc/helpers/-/helpers-0.5.23.tgz",
            "integrity": "sha512-5lSsMOTXURePglDfvuAQUqkGek9Hg2kksOYay2m0+XR++b2NWYL/4sWyuvVBIs8oKnJaxkdi9whaL/sqN13afw==",
            "license": "Apache-2.0",
            "optional": true,
            "peer": true,
            "dependencies": {
              "tslib": "^2.8.0"
            }
          },
          '''
          path.write_text(text.replace(needle, entry + needle, 1))
          PY

      - name: Verify npm ci
        run: npm ci

      - name: Commit repaired lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already repaired"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix: repair npm lockfile peer dependency"
          git push origin HEAD:field/fix-lockfile-swc-helper
