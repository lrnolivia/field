name: inspector visual qa

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Run current combined editor acceptance
        run: npx playwright test src/editor/e2e/inspector-visual-qa.spec.ts src/editor/e2e/combined-ui.spec.ts src/editor/e2e/document-search-responsive.spec.ts --project=chromium --reporter=line
      - name: Stage screenshots inside the workspace
        if: always()
        run: |
          mkdir -p qa-evidence/screenshots
          if [ -d ../screenshots ]; then cp -a ../screenshots/. qa-evidence/screenshots/; fi
      - name: Preserve current-head screenshots and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: field-combined-ui-review
          path: |
            qa-evidence/screenshots/
            test-results/
            playwright-report/
          retention-days: 7

