name: Stage 0 frame diagnostics one-shot

on:
  push:
    branches:
      - stage0/figma-frame-group-parity
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Trace first divergence
        shell: bash
        run: |
          set -euo pipefail
          VITE_REVYME_CLOUD=false npx vite --port 4333 --strictPort --host localhost > /tmp/field-editor-vite.log 2>&1 &
          E=$!
          npx vite --config vite.sandbox.config.ts --host localhost > /tmp/field-sandbox-vite.log 2>&1 &
          S=$!
          npx vite --config vite.preview.config.ts --host localhost > /tmp/field-preview-vite.log 2>&1 &
          P=$!
          trap 'kill "$E" "$S" "$P" 2>/dev/null || true' EXIT
          for port in 4333 5174 5175; do
            for _ in $(seq 1 60); do curl -fsS "http://localhost:${port}/" >/dev/null && break || sleep 1; done
          done
          env -u CI npx playwright test src/canvas/drag/e2e/figma-frame-diagnostics.spec.ts --project=chromium --reporter=list
