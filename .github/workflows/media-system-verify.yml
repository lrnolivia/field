name: Media system verify

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/editor/media/**'
      - 'src/editor/gallery/**'
      - 'src/editor/left-toolbar/panels/MediaGalleryPanel.tsx'
      - 'src/editor/left-toolbar/panels/cms/FieldControl.tsx'
      - 'src/editor/tools/ImageTool.tsx'
      - 'src/editor/tools/VideoTool.tsx'
      - 'src/editor/tools/AudioTool.tsx'
      - 'src/editor/tools/GalleryTool.tsx'
      - 'src/editor/ToolbarPanelHost.tsx'
      - 'src/editor/BottomToolbar.tsx'
      - 'src/editor/toolbar-panel-store.ts'
      - 'src/canvas/CanvasFileDrop.tsx'
      - 'src/canvas/insertion-bridge.ts'
      - 'src/canvas/insert-toolbar-item.ts'
      - '.github/workflows/media-system-verify.yml'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: media-system-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Media tests + editor build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Media and Gallery tests
        run: npm run test:run -- src/editor/media src/editor/gallery
      - name: Production editor build
        run: npm run build

  registry:
    name: Registry gates
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Clean install
        run: npm ci --no-audit --no-fund
      - name: Build all surfaces
        run: npm run build:all
      - name: Full test suite
        id: tests
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/field-registry"
          npm run test:run -- --reporter=json --outputFile="$RUNNER_TEMP/field-registry/branch-tests.json"
      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint
      - name: Prepare exact main baseline
        id: baseline
        if: steps.tests.outcome == 'failure'
        run: |
          git fetch origin main --depth=1
          BASE_SHA="$(git rev-parse origin/main)"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          git worktree add --detach "$RUNNER_TEMP/field-main-baseline" "$BASE_SHA"
          cp package-lock.json "$RUNNER_TEMP/field-main-baseline/package-lock.json"
          cd "$RUNNER_TEMP/field-main-baseline"
          npm ci --no-audit --no-fund
      - name: Baseline full test suite
        id: baseline_tests
        if: steps.tests.outcome == 'failure'
        continue-on-error: true
        working-directory: ${{ runner.temp }}/field-main-baseline
        run: npm run test:run -- --reporter=json --outputFile="${{ runner.temp }}/field-registry/baseline-tests.json"
      - name: Compare branch failures to exact main baseline
        id: baseline_compare
        if: always() && steps.tests.outcome == 'failure'
        env:
          BRANCH_REPORT: ${{ runner.temp }}/field-registry/branch-tests.json
          BASELINE_REPORT: ${{ runner.temp }}/field-registry/baseline-tests.json
          BASE_SHA: ${{ steps.baseline.outputs.base_sha }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function fingerprint(reportPath) {
            if (!fs.existsSync(reportPath)) throw new Error(`missing report: ${reportPath}`);
            const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
            const failures = [];
            for (const result of report.testResults || []) {
              const rawFile = String(result.name || result.testFilePath || '').replaceAll('\\', '/');
              const srcIndex = rawFile.indexOf('/src/');
              const file = srcIndex >= 0 ? rawFile.slice(srcIndex + 1) : rawFile;
              for (const assertion of result.assertionResults || []) {
                if (assertion.status !== 'failed') continue;
                const name = assertion.fullName || assertion.title || assertion.name || '';
                failures.push(`${file} :: ${name}`);
              }
            }
            return failures.sort();
          }

          const branch = fingerprint(process.env.BRANCH_REPORT);
          const baseline = fingerprint(process.env.BASELINE_REPORT);
          const branchOnly = branch.filter(item => !baseline.includes(item));
          const baselineOnly = baseline.filter(item => !branch.includes(item));
          const identical = branchOnly.length === 0 && baselineOnly.length === 0;

          console.log(`branch failures: ${branch.length}`);
          console.log(`baseline failures: ${baseline.length}`);
          console.log(`exact main: ${process.env.BASE_SHA}`);
          console.log(`identical fingerprint: ${identical}`);
          console.log(branchOnly.length ? `Branch-only failures (${branchOnly.length}):\n${branchOnly.map(x => `- ${x}`).join('\\n')}` : 'Branch-only failures: none');
          console.log(baselineOnly.length ? `Baseline-only failures (${baselineOnly.length}):\n${baselineOnly.map(x => `- ${x}`).join('\\n')}` : 'Baseline-only failures: none');

          const summary = [
            '## Registry baseline comparison',
            `- exact main: \`${process.env.BASE_SHA}\``,
            `- branch failures: ${branch.length}`,
            `- baseline failures: ${baseline.length}`,
            `- identical failure fingerprint: ${identical ? 'yes' : 'no'}`,
            '',
            branchOnly.length ? `Branch-only failures (${branchOnly.length}):\n${branchOnly.map(x => `- ${x}`).join('\n')}` : 'Branch-only failures: none',
            '',
            baselineOnly.length ? `Baseline-only failures (${baselineOnly.length}):\n${baselineOnly.map(x => `- ${x}`).join('\n')}` : 'Baseline-only failures: none',
            ''
          ].join('\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);

          if (!identical) process.exit(1);
          NODE
      - name: Enforce registry gates
        if: always()
        run: |
          if [ "${{ steps.tests.outcome }}" != "success" ]; then
            test "${{ steps.baseline_compare.outcome }}" = "success"
          fi
          test "${{ steps.lint.outcome }}" = "success"
