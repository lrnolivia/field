name: Media system verify

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/editor/media/**'
      - 'src/editor/gallery/**'
      - 'src/editor/left-toolbar/panels/MediaGalleryPanel.tsx'
      - 'src/editor/left-toolbar/panels/cms/FieldControl.tsx'
      - 'src/editor/tools/ImageTool.tsx'
      - 'src/editor/tools/VideoTool.tsx'
      - 'src/editor/tools/AudioTool.tsx'
      - 'src/editor/tools/GalleryTool.tsx'
      - 'src/editor/ToolbarPanelHost.tsx'
      - 'src/editor/BottomToolbar.tsx'
      - 'src/editor/toolbar-panel-store.ts'
      - 'src/canvas/CanvasFileDrop.tsx'
      - 'src/canvas/insertion-bridge.ts'
      - 'src/canvas/insert-toolbar-item.ts'
      - '.github/workflows/media-system-verify.yml'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: media-system-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Media tests + editor build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Media and Gallery tests
        run: npm run test:run -- src/editor/media src/editor/gallery
      - name: Production editor build
        run: npm run build

  registry:
    name: Registry gates
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Clean install
        run: npm ci --no-audit --no-fund
      - name: Build all surfaces
        run: npm run build:all
      - name: Full test suite
        id: tests
        continue-on-error: true
        run: npm run test:run -- --reporter=verbose
      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint
      - name: Enforce registry gates
        if: always()
        run: |
          test "${{ steps.tests.outcome }}" = "success"
          test "${{ steps.lint.outcome }}" = "success"
