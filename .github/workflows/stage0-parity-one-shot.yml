name: Stage 0 parity one-shot

on:
  push:
    branches:
      - stage0/canvas-preview-parity-closeout
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage0-parity-one-shot
  cancel-in-progress: true

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Repair known lock drift in CI only
        run: npm install --package-lock-only --ignore-scripts

      - name: Clean install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Canvas Preview parity
        shell: bash
        run: |
          set -euo pipefail
          VITE_REVYME_CLOUD=false npx vite --port 4333 --strictPort --host localhost > /tmp/field-editor-vite.log 2>&1 &
          EDITOR_PID=$!
          npx vite --config vite.sandbox.config.ts --host localhost > /tmp/field-sandbox-vite.log 2>&1 &
          SANDBOX_PID=$!
          npx vite --config vite.preview.config.ts --host localhost > /tmp/field-preview-vite.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$EDITOR_PID" "$SANDBOX_PID" "$PREVIEW_PID" 2>/dev/null || true' EXIT

          for port in 4333 5174 5175; do
            ready=0
            for _ in $(seq 1 60); do
              if curl -fsS "http://localhost:${port}/" >/dev/null; then
                ready=1
                break
              fi
              sleep 1
            done
            if [ "$ready" != "1" ]; then
              echo "::error::Vite server on port ${port} did not become ready"
              echo "--- editor log ---"; cat /tmp/field-editor-vite.log || true
              echo "--- sandbox log ---"; cat /tmp/field-sandbox-vite.log || true
              echo "--- preview log ---"; cat /tmp/field-preview-vite.log || true
              exit 1
            fi
          done

          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage();
          const response = await page.goto('http://localhost:5174/', { waitUntil: 'domcontentloaded' });
          await page.locator('[data-content-root]').waitFor({ state: 'attached', timeout: 10000 });
          console.log('SANDBOX_BOOT_OK status=' + (response?.status() ?? 'none'));
          await browser.close();
          NODE

          env -u CI npx playwright test src/canvas/drag/e2e/layer-stack-preview-parity.spec.ts --project=chromium --grep "Canvas computed styles match Preview" --reporter=list
