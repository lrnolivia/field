name: Stage 0 parity one-shot

on:
  push:
    branches:
      - stage0/canvas-preview-parity-closeout
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage0-parity-one-shot
  cancel-in-progress: true

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Repair known lock drift in CI only
        run: npm install --package-lock-only --ignore-scripts

      - name: Clean install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Canvas Preview parity
        shell: bash
        env:
          CI: "1"
        run: |
          set -euo pipefail
          npx vite --config vite.sandbox.config.ts --host 127.0.0.1 > /tmp/field-sandbox-vite.log 2>&1 &
          SANDBOX_PID=$!
          npx vite --config vite.preview.config.ts --host 127.0.0.1 > /tmp/field-preview-vite.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$SANDBOX_PID" "$PREVIEW_PID" 2>/dev/null || true' EXIT

          for port in 5174 5175; do
            ready=0
            for _ in $(seq 1 60); do
              if curl -fsS "http://127.0.0.1:${port}/" >/dev/null; then
                ready=1
                break
              fi
              sleep 1
            done
            if [ "$ready" != "1" ]; then
              echo "::error::Vite server on port ${port} did not become ready"
              echo "--- sandbox log ---"
              cat /tmp/field-sandbox-vite.log || true
              echo "--- preview log ---"
              cat /tmp/field-preview-vite.log || true
              exit 1
            fi
          done

          npx playwright test src/canvas/drag/e2e/layer-stack-preview-parity.spec.ts --project=chromium --grep "Canvas computed styles match Preview" --reporter=list
