name: PR90 Inspector hotfix one-shot

on:
  push:
    branches:
      - stage0/text-edit-inspector-selection
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr90-inspector-hotfix-one-shot
  cancel-in-progress: true

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Repair known lock drift in CI only
        run: npm install --package-lock-only --ignore-scripts

      - name: Clean install
        run: npm ci

      - name: Run Inspector hotfix regressions
        run: |
          npx vitest run \
            src/canvas/mouse/CanvasMouseController.test.ts \
            src/editor/controls/touch-scrub.test.tsx \
            src/editor/tools/layout-padding.test.ts
          npx vitest run src/editor/figma-inspector-contract.test.ts -t "keeps Layout permanent while Auto layout owns child arrangement only"
